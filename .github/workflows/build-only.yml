name: Build and Release Windows App (No Tests)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'اسم العلامة (Tag) للإصدار (مثل: v1.0.3)'
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (skip native build)
        run: npm install --ignore-scripts
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.electron

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Build and publish Windows app
        run: npm run build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  

